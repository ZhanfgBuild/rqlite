name: Stress slow-query test on Windows

on:
  push:
    branches:
      - ci/diagnose-appveyor-2738

jobs:
  focused:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run slow-query regression repeatedly
        run: go test ./db -run '^TestSlowQueryLogging$' -count=50 -v
